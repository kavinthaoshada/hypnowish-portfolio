<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="apple-touch-icon" sizes="76x76" href="{{ ASSETS_ROOT }}/img/apple-icon.png">
  <link rel="icon" type="image/png" href="{{ ASSETS_ROOT }}/img/favicon.png">
  
  <title>{% block title %}E-Commerce Fullscreen{% endblock %}</title>
  
  <!-- Fonts and Icons -->
  <link href="https://fonts.googleapis.com/css?family=Open+Sans:300,400,600,700" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

  <!-- CSS Files -->
  <link href="{{ ASSETS_ROOT }}/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ ASSETS_ROOT }}/css/main.css" rel="stylesheet">
  
  {% block stylesheets %}{% endblock stylesheets %}
</head>

<body class="d-flex flex-column min-vh-100">
  <!-- Main Content -->
  <div class="container d-flex flex-column justify-content-center align-items-center vh-100">
    {% block content %}{% endblock content %}
  </div>
  
  <!-- Scripts -->
  <script src="{{ ASSETS_ROOT }}/js/jquery.min.js"></script>
  <script src="{{ ASSETS_ROOT }}/js/bootstrap.bundle.min.js"></script>
  <script src="{{ ASSETS_ROOT }}/js/main.js"></script>
  
  {% block javascripts %}{% endblock javascripts %}
</body>
</html>
